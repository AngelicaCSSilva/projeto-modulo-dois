name: Demonstração de vulnerabilidades da imagem
run-name: "Cenário ${{ inputs.scenario }} — demonstração de segurança"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Cenário para demonstração
        type: choice
        required: true
        default: vulnerable
        options:
          - vulnerable
          - fixed

permissions:
  contents: read

jobs:
  build_image:
    name: Construir imagem de demonstração
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir imagem do cenário
        id: build
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario }}
          IMAGE: demo:${{ github.sha }}
        run: docker build --tag "$IMAGE" "scenarios/$SCENARIO"

      - name: Exportar imagem para o próximo job
        id: save_image
        shell: bash
        env:
          IMAGE: demo:${{ github.sha }}
        run: docker save --output image.tar "$IMAGE"

      - name: Publicar imagem como artefato
        id: upload_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagem-demo-${{ github.run_id }}
          path: image.tar
          if-no-files-found: error
          compression-level: 0

      - name: Resumo da construção
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          SAVE_RESULT: ${{ steps.save_image.outcome }}
          UPLOAD_RESULT: ${{ steps.upload_image.outcome }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          {
            echo "## Construção da imagem"
            echo
            echo "- Cenário: **$SCENARIO**"
            echo "- Build: **$BUILD_RESULT**"
            echo "- Exportação: **$SAVE_RESULT**"
            echo "- Artefato: **$UPLOAD_RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"

  demonstrate_attack:
    name: Executar demonstrações
    needs: build_image
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar imagem construída
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagem-demo-${{ github.run_id }}

      - name: Carregar imagem no Docker
        shell: bash
        env:
          IMAGE: demo:${{ github.sha }}
        run: docker load --input image.tar

      - name: Iniciar aplicação isolada
        id: start_container
        shell: bash
        env:
          IMAGE: demo:${{ github.sha }}
          CONTAINER: demo-${{ github.run_id }}
        run: docker run --detach --name "$CONTAINER" --cpus=1 --memory=256m --publish 127.0.0.1:3000:3000 "$IMAGE"

      - name: Simular abuso do usuário privilegiado
        id: privilege_test
        shell: bash
        env:
          CONTAINER: demo-${{ github.run_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -u
          protected_file="/root/privilege-canary.txt"
          failed=0
          runtime_uid=unknown
          attack_result=falha_na_preparacao
          attack_output=""

          if runtime_uid="$(docker exec "$CONTAINER" id -u)"; then
            echo "UID efetivo do processo: $runtime_uid"
          else
            echo "Não foi possível consultar o UID do processo."
            failed=1
          fi

          # O arquivo canário existe somente no contêiner descartável.
          if docker exec --user 0 "$CONTAINER" sh -c "printf original > '$protected_file' && chmod 600 '$protected_file'"; then
            echo "Tentando alterar o arquivo protegido com o usuário padrão do aplicativo..."
            if attack_output="$(docker exec "$CONTAINER" sh -c "printf alterado-pelo-app >> '$protected_file'" 2>&1)"; then
              attack_result=permitido
              echo "A escrita foi permitida."
            else
              attack_result=bloqueado
              echo "A escrita foi negada."
            fi
            if [[ -n "$attack_output" ]]; then
              echo "$attack_output"
            fi
          else
            echo "Falha ao preparar o arquivo canário protegido."
            failed=1
          fi

          if [[ "$SCENARIO" == "vulnerable" && "$attack_result" != "permitido" ]]; then
            echo "Esperava-se escrita permitida como root no cenário vulnerável."
            failed=1
          elif [[ "$SCENARIO" == "fixed" && "$attack_result" != "bloqueado" ]]; then
            echo "Esperava-se que o usuário não privilegiado fosse bloqueado."
            failed=1
          fi

          {
            echo "## Teste de abuso de privilégio"
            echo
            echo "Tentativa de modificar um arquivo protegido, dentro do contêiner, usando o usuário padrão da aplicação."
            echo
            echo "| Cenário | UID observado | Ataque | Resultado esperado |"
            echo "|---|---:|---|---|"
            if [[ "$SCENARIO" == "vulnerable" ]]; then
              echo "| $SCENARIO | $runtime_uid | $attack_result | Escrita permitida como root |"
            else
              echo "| $SCENARIO | $runtime_uid | $attack_result | Escrita bloqueada |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

      - name: Demonstrar a CVE-2022-38900 por HTTP
        id: cve_test
        shell: bash
        env:
          CONTAINER: demo-${{ github.run_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "O serviço não ficou pronto dentro do tempo esperado."
            exit 1
          fi

          node scripts/demo-attack.mjs "$SCENARIO"
          running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER")"
          echo "Contêiner em execução após a requisição: $running"

          if [[ "$SCENARIO" == "vulnerable" && "$running" != "false" ]]; then
            echo "Esperava-se que a requisição encerrasse o processo vulnerável."
            exit 1
          elif [[ "$SCENARIO" == "fixed" && "$running" != "true" ]]; then
            echo "Esperava-se que o serviço corrigido continuasse ativo."
            exit 1
          fi

          {
            echo
            echo "### Resultado do teste HTTP"
            echo
            echo "- Cenário: **$SCENARIO**"
            echo "- Contêiner após a requisição: **$running**"
            if [[ "$SCENARIO" == "vulnerable" ]]; then
              echo "- Esperado: a entrada malformada encerra o processo vulnerável."
            else
              echo "- Esperado: o serviço corrigido continua respondendo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exibir logs do servidor
        if: always() && steps.start_container.outcome == 'success'
        env:
          CONTAINER: demo-${{ github.run_id }}
        run: docker logs --timestamps "$CONTAINER" 2>&1 || true

      - name: Remover contêiner de demonstração
        if: always()
        env:
          CONTAINER: demo-${{ github.run_id }}
        run: docker rm --force "$CONTAINER" >/dev/null 2>&1 || true

      - name: Resumo final da demonstração
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          SCENARIO: ${{ inputs.scenario }}
          PRIVILEGE_RESULT: ${{ steps.privilege_test.outcome }}
          CVE_RESULT: ${{ steps.cve_test.outcome }}
        run: |
          {
            echo
            echo "## Resultado final"
            echo
            echo "- Cenário: **$SCENARIO**"
            echo "- Teste de abuso de privilégio: **$PRIVILEGE_RESULT**"
            echo "- Teste HTTP da CVE: **$CVE_RESULT**"
            echo "- Resultado do job: **$JOB_RESULT**"
            echo
            echo "O teste do arquivo canário demonstra o efeito de executar como root dentro do contêiner. Ele é independente da CVE-2022-38900, que demonstra negação de serviço."
          } >> "$GITHUB_STEP_SUMMARY"
