name: Vulnerability Test Workflow - Demonstrar CVE-2022-38900
run-name: "[ Ambiente: ${{ inputs.scenario }} ] Workflow de teste de vulnerabilidade"

# Execução manual para escolher um único cenário.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Cenário para demonstração da CVE-2022-38900
        type: choice
        required: true
        default: vulnerable
        options:
          - vulnerable
          - fixed

permissions:
  # O workflow só precisa ler o repositório para construir a imagem.
  contents: read

jobs:
  attack-demo:
    # Executa somente o cenário selecionado em um container isolado.
    name: Demonstrar falha de decode-uri-component
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # Coleta o resultado; o gate avalia o status depois da demonstração.
      - name: Enviar requisição externa ao cenário escolhido
        id: attack
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          scenario="$SCENARIO"
          image="supply-chain-demo-${scenario}:${GITHUB_SHA}"
          container="supply-chain-demo-${scenario}-${GITHUB_RUN_ID}"
          dependency_version="$(node -p "require('./scenarios/' + process.argv[1] + '/package.json').dependencies['decode-uri-component']" "$scenario")"
          failed=0
          client_result=not_run
          running=unknown
          {
            echo "## Demonstração da CVE-2022-38900"
            echo
            echo "| Informação | Valor |"
            echo "|---|---|"
            echo "| Cenário | \`${scenario}\` |"
            echo "| Dependência | \`decode-uri-component@${dependency_version}\` |"
            echo "| Entrada enviada | \`%ea%ba%5a%ba\` |"
            echo "| Destino | \`http://127.0.0.1:3000/payment\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[workflow] Cenário selecionado: ${scenario}"
          echo "[workflow] Versão de decode-uri-component: ${dependency_version}"
          echo "[workflow] Construindo imagem: ${image}"

          if ! docker build -t "$image" "scenarios/${scenario}"; then
            echo "[workflow] ERRO: a construção da imagem falhou para ${scenario}." | tee -a "$GITHUB_STEP_SUMMARY"
            failed=1
          elif ! docker run -d --name "$container" --cpus=1 --memory=256m -p 127.0.0.1:3000:3000 "$image"; then
            # Limita recursos e publica a porta apenas no loopback do runner.
            echo "[workflow] ERRO: o container não iniciou para ${scenario}." | tee -a "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "[workflow] Container iniciado: ${container}"
            echo "[workflow] Aguardando o endpoint HTTP de prontidão..."
            ready=0
            for attempt in {1..30}; do
              if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
                ready=1
                echo "[workflow] Serviço pronto após a tentativa ${attempt}."
                break
              fi
              echo "[workflow] Tentativa ${attempt}/30: serviço ainda iniciando."
              sleep 2
            done

            # O cliente separado envia a requisição HTTP de demonstração.
            if [[ "$ready" -eq 1 ]]; then
              if node scripts/demo-attack.mjs "$scenario"; then
                client_result=passed
              else
                client_result=failed
                failed=1
              fi
            else
              echo "[workflow] ERRO: o serviço não ficou pronto para ${scenario}." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "[workflow] A verificação de prontidão não recebeu HTTP 200."
              client_result=not_ready
              failed=1
            fi

            # Confirma se a conexão falhou porque o processo vulnerável encerrou.
            running="$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || echo unknown)"
            echo "[workflow] Resultado do cliente: ${client_result}"
            echo "[workflow] Container em execução após a requisição: ${running}"
            {
              echo
              echo "#### Verificação do processo"
              echo
              echo "| Verificação | Resultado |"
              echo "|---|---|"
              echo "| Cliente externo | \`${client_result}\` |"
              echo "| Container ainda ativo | \`${running}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$scenario" == "vulnerable" && "$running" != "false" ]]; then
              echo "[workflow] ERRO: era esperado que o container vulnerável encerrasse."
              failed=1
            elif [[ "$scenario" == "fixed" && "$running" != "true" ]]; then
              echo "[workflow] ERRO: era esperado que o container corrigido continuasse ativo."
              failed=1
            fi

            # Exibe o stack trace no console do job e em bloco shell no Summary.
            echo "[workflow] Logs do servidor antes da limpeza:"
            {
              echo
              echo "#### Log do servidor (Docker)"
              echo
              echo '```shell'
            } >> "$GITHUB_STEP_SUMMARY"
            docker logs --timestamps "$container" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker rm -f "$container" >/dev/null 2>&1
          fi

          result="FALHOU"
          [[ "$failed" -eq 0 ]] && result="PASSOU"
          echo "[workflow] Resultado final da demonstração: ${result}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resultado do job de demonstração: ${result}.**" >> "$GITHUB_STEP_SUMMARY"
          echo "gate_passed=$([[ "$failed" -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # O Resultado final roda depois da demonstração do cenário selecionado.
      - name: Resultado final da demonstração
        if: always()
        env:
          GATE_PASSED: ${{ steps.attack.outputs.gate_passed }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ "$SCENARIO" == "vulnerable" ]]; then
            expected="a requisição provoca a exceção e o processo vulnerável encerra"
          else
            expected="a versão corrigida responde com HTTP 200 e continua em execução"
          fi

          if [[ "$GATE_PASSED" != "true" ]]; then
            echo "## Resultado final: comportamento diferente do esperado" >> "$GITHUB_STEP_SUMMARY"
            echo "Cenário selecionado: **${SCENARIO}**." >> "$GITHUB_STEP_SUMMARY"
            echo "Comportamento esperado: ${expected}." >> "$GITHUB_STEP_SUMMARY"
            echo "O resultado observado não confirmou esse comportamento. Consulte os logs do cliente e do servidor acima." >> "$GITHUB_STEP_SUMMARY"
            echo "[resultado] O cenário ${SCENARIO} não apresentou o comportamento esperado: ${expected}."
            exit 1
          fi
          echo "## Resultado final: comportamento esperado observado" >> "$GITHUB_STEP_SUMMARY"
          echo "Cenário selecionado: **${SCENARIO}**." >> "$GITHUB_STEP_SUMMARY"
          echo "Comportamento esperado: ${expected}." >> "$GITHUB_STEP_SUMMARY"
          echo "O resultado observado corresponde ao esperado para este cenário." >> "$GITHUB_STEP_SUMMARY"
          echo "[resultado] O cenário ${SCENARIO} apresentou o comportamento esperado: ${expected}."
